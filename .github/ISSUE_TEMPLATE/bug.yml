name: Bug
description: Report a defect with reproducible evidence.
title: "[Bug] "
labels:
  - bug
body:
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Provide deterministic reproduction steps.
      placeholder: |
        1. Go to ...
        2. Run ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected_actual
    attributes:
      label: Expected vs Actual
      description: Clearly state expected behavior and actual behavior.
      placeholder: |
        Expected:
        Actual:
    validations:
      required: true
